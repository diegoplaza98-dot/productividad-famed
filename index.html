
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d32">
  <title>Productividad FAMED</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f4;
      color: #26352e;
    }

    button, input { font: inherit; }

    .topbar {
      background: #173d32;
      color: white;
      padding: 19px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar h1 {
      font-size: 19px;
      margin: 0;
      letter-spacing: .7px;
    }

    .topbar small {
      display: block;
      color: #d0ddd5;
      margin-top: 5px;
    }

    .logout {
      background: transparent;
      color: white;
      border: 1px solid #8da69a;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    .layout {
      max-width: 1100px;
      margin: auto;
      padding: 22px 16px;
    }

    .nav {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      margin-bottom: 25px;
    }

    .nav button {
      border: 1px solid #dce4de;
      background: white;
      color: #52645a;
      padding: 11px 15px;
      border-radius: 9px;
      white-space: nowrap;
    }

    .nav button.active {
      background: #173d32;
      color: white;
      border-color: #173d32;
    }

    h2 {
      font-size: 23px;
      margin: 0 0 8px;
      color: #173d32;
    }

    .subtitle {
      color: #78847d;
      margin: 0 0 22px;
      font-size: 14px;
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 13px;
      border: 1px solid #e7ebe8;
      margin-bottom: 18px;
    }

    .panel h3 {
      margin: 0 0 17px;
      font-size: 17px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin: 14px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dce3de;
      border-radius: 8px;
      background: #fbfcfb;
      font-size: 16px;
    }

    .primary {
      background: #173d32;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 13px 17px;
      font-weight: bold;
      margin-top: 17px;
      width: 100%;
    }

    .primary:disabled { opacity: .6; }

    .clinic {
      border: 1px solid #e4eae5;
      border-radius: 11px;
      padding: 16px;
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .clinic h4 {
      margin: 0 0 6px;
      color: #173d32;
      font-size: 16px;
    }

    .clinic p {
      margin: 0;
      color: #78847d;
      font-size: 13px;
    }

    .status {
      display: inline-block;
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 20px;
      background: #e8f3eb;
      color: #286342;
      margin-top: 9px;
    }

    .status.inactive {
      background: #f1eeee;
      color: #777;
    }

    .secondary {
      background: #edf2ee;
      color: #244b38;
      border: 0;
      border-radius: 7px;
      padding: 9px 11px;
      font-size: 12px;
      white-space: nowrap;
    }

    .empty {
      color: #89938d;
      font-size: 14px;
      text-align: center;
      padding: 25px 10px;
    }

    .message {
      font-size: 14px;
      margin-top: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error { color: #b52e2e; }
    .success { color: #247346; }

    .hidden { display: none !important; }

    #login {
      max-width: 420px;
      margin: 70px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
    }

    #login h2 { text-align: center; }

    @media (min-width: 650px) {
      .columns {
        display: grid;
        grid-template-columns: 1fr 1.3fr;
        gap: 18px;
        align-items: start;
      }
    }
  </style>
</head>

<body>

  <section id="login" class="hidden">
    <h2>CLÍNICAS FAMED</h2>
    <p>Acceso de administrador</p>

    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" required autocomplete="username">

      <label for="password">Contraseña</label>
      <input id="password" type="password" required
             autocomplete="current-password">

      <button class="primary" type="submit" id="loginButton">
        Iniciar sesión
      </button>
    </form>
    <p id="loginMessage" class="message"></p>
  </section>

  <div id="app" class="hidden">

    <header class="topbar">
      <div>
        <h1>CLÍNICAS FAMED</h1>
        <small>Control de productividad</small>
      </div>
      <button class="logout" id="logoutButton">Salir</button>
    </header>

    <main class="layout">

      <nav class="nav">
        <button class="active" id="navClinics">Clínicas</button>
        <button disabled>Fisioterapeutas</button>
        <button disabled>Producción</button>
        <button disabled>Estadísticas</button>
      </nav>

      <section>
        <h2>Gestión de clínicas</h2>
        <p class="subtitle">
          Administra los centros donde se registra la actividad.
        </p>

        <div class="columns">

          <div class="panel">
            <h3 id="formTitle">Añadir clínica</h3>

            <form id="clinicForm">
              <label for="clinicName">Nombre de la clínica *</label>
              <input id="clinicName" type="text"
                     placeholder="Ej. FAMED Coslada" required maxlength="100">

              <label for="clinicAddress">Dirección</label>
              <input id="clinicAddress" type="text"
                     placeholder="Dirección del centro" maxlength="200">

              <button class="primary" id="saveClinic" type="submit">
                Guardar clínica
              </button>

              <button class="secondary hidden" id="cancelEdit"
                      type="button">
                Cancelar edición
              </button>
            </form>

            <p id="clinicMessage" class="message"></p>
          </div>

          <div class="panel">
            <h3>Clínicas registradas</h3>
            <div id="clinicList">
              <p class="empty">Cargando clínicas...</p>
            </div>
          </div>

        </div>
      </section>

    </main>
  </div>

  <script>
    // ==========================================
    // CONEXIÓN CON SUPABASE
    // ==========================================

    const SUPABASE_URL = "https://orokidiumerjlhwcpsej.supabase.co";
    const SUPABASE_KEY = "sb_publishable_le92S4ET4dt5c5vNvyXQmQ_jr_buC3X";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let currentUser = null;
    let editingClinicId = null;

    const $ = id => document.getElementById(id);

    function message(id, text, type = "") {
      const element = $(id);
      element.textContent = text;
      element.className = "message " + type;
    }

    function showLogin() {
      $("login").classList.remove("hidden");
      $("app").classList.add("hidden");
    }

    function showApp() {
      $("login").classList.add("hidden");
      $("app").classList.remove("hidden");
    }

    // ==========================================
    // AUTENTICACIÓN
    // ==========================================

    async function startApp() {
      const { data, error } = await db.auth.getSession();

      if (error) {
        showLogin();
        message("loginMessage", error.message, "error");
        return;
      }

      if (data.session) {
        currentUser = data.session.user;
        showApp();
        await loadClinics();
      } else {
        showLogin();
      }
    }

    $("loginForm").addEventListener("submit", async event => {
      event.preventDefault();

      $("loginButton").disabled = true;
      $("loginButton").textContent = "Conectando...";

      const { data, error } = await db.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });

      $("loginButton").disabled = false;
      $("loginButton").textContent = "Iniciar sesión";

      if (error) {
        message("loginMessage", error.message, "error");
        return;
      }

      currentUser = data.user;
      showApp();
      await loadClinics();
    });

    $("logoutButton").addEventListener("click", async () => {
      const { error } = await db.auth.signOut();

      if (error) {
        alert(error.message);
        return;
      }

      currentUser = null;
      showLogin();
    });

    // ==========================================
    // GESTIÓN DE CLÍNICAS
    // ==========================================

    async function loadClinics() {
      $("clinicList").innerHTML = "";
      $("clinicList").appendChild(
        Object.assign(document.createElement("p"), {
          className: "empty",
          textContent: "Cargando clínicas..."
        })
      );

      const { data, error } = await db
        .from("clinics")
        .select("*")
        .order("name");

      if (error) {
        $("clinicList").textContent = "";
        $("clinicList").appendChild(
          Object.assign(document.createElement("p"), {
            className: "message error",
            textContent: "Error al cargar clínicas: " + error.message
          })
        );
        return;
      }

      renderClinics(data || []);
    }

    function renderClinics(clinics) {
      const list = $("clinicList");
      list.textContent = "";

      if (clinics.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Todavía no has registrado ninguna clínica.";
        list.appendChild(empty);
        return;
      }

      clinics.forEach(clinic => {
        const card = document.createElement("div");
        card.className = "clinic";

        const info = document.createElement("div");

        const name = document.createElement("h4");
        name.textContent = clinic.name;

        const address = document.createElement("p");
        address.textContent = clinic.address || "Sin dirección indicada";

        const status = document.createElement("span");
        status.className = "status" +
          (clinic.active ? "" : " inactive");
        status.textContent = clinic.active ? "Activa" : "Inactiva";

        info.append(name, address, status);

        const actions = document.createElement("div");

        const edit = document.createElement("button");
        edit.className = "secondary";
        edit.textContent = "Editar";
        edit.addEventListener("click", () => editClinic(clinic));

        const toggle = document.createElement("button");
        toggle.className = "secondary";
        toggle.style.marginTop = "7px";
        toggle.textContent = clinic.active ? "Desactivar" : "Activar";
        toggle.addEventListener("click", () => toggleClinic(clinic));

        actions.append(edit, toggle);
        card.append(info, actions);
        list.appendChild(card);
      });
    }

    // ==========================================
    // GUARDAR CLÍNICA
    // ==========================================

    $("clinicForm").addEventListener("submit", async event => {
      event.preventDefault();

      if (!currentUser) return;

      const button = $("saveClinic");
      button.disabled = true;
      button.textContent = "Guardando...";

      const clinicData = {
        name: $("clinicName").value.trim(),
        address: $("clinicAddress").value.trim() || null
      };

      let result;

      if (editingClinicId) {
        result = await db
          .from("clinics")
          .update(clinicData)
          .eq("id", editingClinicId);
      } else {
        result = await db
          .from("clinics")
          .insert({
            ...clinicData,
            owner_id: currentUser.id
          });
      }

      button.disabled = false;
      button.textContent = editingClinicId
        ? "Guardar cambios"
        : "Guardar clínica";

      if (result.error) {
        message("clinicMessage",
          "No se pudo guardar: " + result.error.message, "error");
        return;
      }

      message("clinicMessage",
        editingClinicId ? "Clínica actualizada." : "Clínica creada correctamente.",
        "success");

      resetClinicForm();
      await loadClinics();
    });

    // ==========================================
    // EDITAR CLÍNICA
    // ==========================================

    function editClinic(clinic) {
      editingClinicId = clinic.id;

      $("clinicName").value = clinic.name;
      $("clinicAddress").value = clinic.address || "";

      $("formTitle").textContent = "Editar clínica";
      $("saveClinic").textContent = "Guardar cambios";
      $("cancelEdit").classList.remove("hidden");

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetClinicForm() {
      editingClinicId = null;
      $("clinicForm").reset();
      $("formTitle").textContent = "Añadir clínica";
      $("saveClinic").textContent = "Guardar clínica";
      $("cancelEdit").classList.add("hidden");
    }

    $("cancelEdit").addEventListener("click", resetClinicForm);

    // ==========================================
    // ACTIVAR / DESACTIVAR CLÍNICA
    // ==========================================

    async function toggleClinic(clinic) {
      const newStatus = !clinic.active;

      const { error } = await db
        .from("clinics")
        .update({ active: newStatus })
        .eq("id", clinic.id);

      if (error) {
        message("clinicMessage",
          "No se pudo cambiar el estado: " + error.message, "error");
        return;
      }

      message("clinicMessage",
        "Estado de la clínica actualizado.", "success");

      await loadClinics();
    }

    // ==========================================
    // INICIO
    // ==========================================

    db.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT") {
        currentUser = null;
        showLogin();
      }
    });

    startApp();

  </script>

</body>
</html>
